version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nextcms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nextcms
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextcms-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://user:pass@mysql:3306/nextcms"
      NEXT_PUBLIC_SITE_URL: "https://api31.winds-os.com"
      NODE_ENV: "production"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma

volumes:
  mysql_data:
